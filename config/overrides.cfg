# K2 base overrides — vanilla variant. Loaded last, wins.
# NOTE: NO stubs here — NOZZLE_CLEAN / PARSE_FLUSH_VOLUMES / BOX_GO_TO_WASTEBIN
# come from the real (vendored) box module, config in box.cfg.

[gcode_macro _START_PRINT_VARS]
variable_heat_soak: 0
variable_offset_ASA: 0
variable_offset_DEFAULT: 0.00
gcode:

# motor_control module is NOT loaded on base (no RS485 motor init, no hum);
# this no-op keeps pause/resume macros functional.
[gcode_macro REQUIRE_EXTRUDER_CLEAR]
gcode:
