# CFS (Creality box) — base-K2 coordinates, from factory F021 box.cfg (V1.1.6.7).
# Param names are the open box module's (Jacob10383/kalico, GPL-3).
# Coordinates marked VERIFY need a live check on hardware:
#  - factory gives only the strip middle y=291.5 (x 127..137) — pad edges guessed ±5mm
#  - base has no factory wastebin param; x=115 taken from factory extrude_pos (purge point)

[box]
box_count: 1                           # Combo = one CFS unit (faster startup)

clean_pad_left_x: 127                  # factory clean_left_pos_x
clean_pad_right_x: 137                 # factory clean_right_pos_x
clean_pad_front_y: 286.5               # VERIFY: pad front edge (factory middle 291.5)
clean_pad_back_y: 296.5                # VERIFY: pad back edge
wastebin_pos_x: 115.0                  # VERIFY: factory extrude_pos_x (purge point)
wastebin_pos_y: 294.0                  # VERIFY

pre_cut_pos_x: 10.0                    # factory pre_cut_pos_x
cut_pos_y: 150.0                       # factory cut_pos_y
check_cut_pos_x_max: -5.5              # cutter calibration search window (Plus-tested)
check_cut_pos_x_min: -9.5

travel_velocity: 18000.0
clean_velocity: 9000.0
z_velocity: 600.0
