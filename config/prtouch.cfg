# K2 base nozzle load-cell probe (CS1237). Pins match extras/prtouch.py defaults,
# which are identical for K2 and K2 Plus (verified against factory F021 config).
# Brush/pad coordinates rescaled from factory F021: prth_clr_brush_pos = 151, 291.

[prtouch]
z_offset: -0.07  # paper-calibrated 2026-09-06 (load cell triggers ~0.07mm before nozzle contact)
register_as_probe: True
speed: 5
lift_speed: 40
samples: 1
sample_retract_dist: 2.0
samples_result: median
samples_tolerance: 0.02
samples_tolerance_retries: 3

# PRTOUCH_HOME — bed center for 260x260
home_xy: 130, 130
home_samples: 3
home_max_samples: 10
home_max_noisy: 3
home_sample_range: 0.010
home_travel_speed: 200
home_z_hop: 2
thermal_expansion: 0.00083  # mm/°C; PRTOUCH_HOME PRINT_TEMP=<C>

# PRTOUCH_SCRUB — silicone brush strip on the rear panel (factory: x 145..155, y 291.5)
scrub_x_start: 145
scrub_x_end: 156
scrub_y_min: 289
scrub_y_max: 293
scrub_detect_hold_ratio: 2.5
scrub_detect_deflection: 0.035
scrub_tab_depth: 0.15
scrub_no_tab_depth: 0.05
scrub_speed: 10

# Detector — same ADC as Plus
pres_tri_hold: 4000, 10000, 500
pres_tri_fter: 5.0, 1.0, 0.8
pres_ded_tkms: 128

[bed_mesh]
zero_reference_position: 130, 130
speed: 200
mesh_min: 5, 5
mesh_max: 255, 255
probe_count: 11, 11
mesh_pps: 2, 2
adaptive_margin: 10
fade_start: 5.0
fade_end: 50.0
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 3
split_delta_z: 0.01
move_check_distance: 3
