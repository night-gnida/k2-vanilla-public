# === Creality K2 base (F021) — UPSTREAM klipper3d host + open-source K2 extras ===
# NOTE: no homing_accel (kalico-only option, absent in upstream).

# Host: vanilla Klipper (github.com/Klipper3d/klipper) built on-printer via Entware.
# MCUs keep stock Creality firmware (protocol is negotiated at connect; proven by
# Jacob10383 stack). K2-specific modules below are GPL-3 reimplementations by
# Jacob10383 (kalico), vendored unmodified: prtouch (load-cell probe), serial_485,
# motor_control (closed-loop), box* (CFS), motion_limits, force_stop_homing,
# led_idle_manager, power_loss_recovery (Kalico PLR — в апстриме его нет).
# Base hardware diff vs Plus: axes 262/296.5/270, single Z (gear 64:20, TMC2208 PC1),
# y dir PB9/!PA8, no chamber heater, bed table from stock fw V1.1.6.7.


[serial_485 serial485]
serial: /dev/ttyS5
baud: 230400

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[duplicate_pin_override]
pins: PC5,PC7,PB7,PB8,PB9,PB10,PB5,PB6,PA1,PB15,PB11,PB12,PB13,PA10,PA9,PA15,PA8,PA0,PB2,PB14,PB3

[virtual_sdcard]
path: /mnt/UDISK/printer_data/gcodes
on_error_gcode: _RESET_PRINT_STATE

[power_loss_recovery]

[idle_timeout]
timeout: 99999999

[force_move]
enable_force_move: true

[force_stop_homing]

[gcode_arcs]
resolution: 1.0

[motion_limits]

[exclude_object]

[display_status]

[pause_resume]


# === Motion ===


[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB11
position_endstop: 262
position_min: -12
position_max: 262
homing_speed: 150
second_homing_speed: 50
homing_retract_dist: 5

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA8
microsteps: 16
rotation_distance: 40
endstop_pin: PB12
position_endstop: -3
position_min: -3
position_max: 296.5
homing_speed: 150
second_homing_speed: 50
homing_retract_dist: 5

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PA10
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: prtouch:z_virtual_endstop
position_min: -5
position_max: 270
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 0

[tmc2208 stepper_z]
uart_pin: PC1
run_current: 0.84
sense_resistor: 0.100
stealthchop_threshold: 0

[axis_twist_compensation]
calibrate_start_x: 10
calibrate_end_x: 250
calibrate_y: 130

[screws_tilt_adjust]
screw1: 30, 30
screw1_name: Front Left
screw2: 230, 30
screw2_name: Front Right
screw3: 230, 230
screw3_name: Rear Right
screw4: 30, 230
screw4_name: Rear Left
speed: 100
horizontal_move_z: 10
screw_thread: CW-M4


# === Heaters ===

[thermistor my_thermistor]
temperature1: 25
resistance1: 98633
temperature2: 220
resistance2: 377
temperature3: 320
resistance3: 73

[extruder]
max_extrude_cross_section: 100
max_extrude_only_distance: 1000.0
step_pin: nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: my_thermistor
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.038
pressure_advance_smooth_time: 0.038
min_temp: -30
max_temp: 315
control: pid
pid_kp: 30.236
pid_ki: 3.475
pid_kd: 65.763
# NOTE: stock F021 also sets high_temp_value/pid_*_high_temp (32.827/3.367/80.016 @280C),
# but that is a Creality-fork-only option — absent in upstream/Kalico, do not copy.

[thermistor custom_bed_thermistor]
# real base-K2 bed table from stock fw V1.1.6.7 (F021 printer.cfg) — NOT the Plus EPCOS table
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 27586
temperature3: 100
resistance3: 6610

[heater_bed]
heater_pin: PC8
sensor_type: custom_bed_thermistor
sensor_pin: PC4
control: pid
max_power: 0.5
pid_Kp: 18.578
pid_Ki: 0.152
pid_Kd: 298.489
min_temp: -30
max_temp: 115

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10


# === Fans, LEDs, outputs ===

[fan]
pin: !nozzle_mcu:PB15
enable_pin: nozzle_mcu:PB6
cycle_time: 0.010
hardware_pwm: false
off_below: 0.02
shutdown_speed: 0

[temperature_fan chamber_fan]
pin: PB3
cycle_time: 0.010
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 80
control: watermark
max_delta: 2
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0

[temperature_sensor chamber_temp]
# stock base shows chamber temp (same PC5 thermistor as chamber_fan)
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 125

[fan_generic aux_fans]
pin: PB4
cycle_time: 0.025
hardware_pwm: false
off_below: 0.10
kick_start_time: 1.0
shutdown_speed: 0

[controller_fan extruder_motor_fan]
pin: nozzle_mcu:PB1
stepper:
heater: extruder
fan_speed: 1.0
idle_timeout: 30
shutdown_speed: 0

[output_pin board_dissipation_fan]
pin: PA0
value: 1

[output_pin ptc_power]
pin: PB2
value: 1

[output_pin power_latch]
pin: PC9
value: 1

[multi_pin LED_pin]
pins: PB0,PA12

[output_pin LED]
pin: multi_pin:LED_pin
pwm: True
cycle_time: 0.010
value: 1

[led_idle_manager]
timeout: 300


# === Sensors ===

[filament_switch_sensor filament_sensor]
pause_on_runout: false
switch_pin: ^!nozzle_mcu:PA11
runout_gcode:
  RESPOND TYPE=echo MSG="Filament sensor runout"
  PAUSE

[lis2dw]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: lis2dw
probe_points:
   130,130,20
min_freq: 20
max_freq: 120
accel_per_hz: 100

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 50
shaper_type_y: mzv
shaper_freq_y: 50


# === Includes (overrides.cfg loads last and wins) ===

[include macros.cfg]
[include start_print.cfg]
[include box.cfg]
[include motor_control.cfg]
# BEGIN_PROBE_STACK
[include prtouch.cfg]
# END_PROBE_STACK
[printer]
kinematics: corexy
max_velocity: 800
max_accel: 30000
minimum_cruise_ratio: 0.5
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 10

[include overrides.cfg]
