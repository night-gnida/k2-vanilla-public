# K2 base closed-loop motor overrides.
# Base K2 has closed-loop X/Y/E only (factory: motor_closed_loop: x,y,e);
# Z is a plain TMC2208 — no z/z1 controller overrides here.

[motor_control]
cut_pos_offset: 0.4
# Periodic 0x0C protection-status poll (seconds). Stock polls once at boot
# only; keep this slow - mid-motion 485 is lossy and the module treats a
# missed poll as "unverified", never as a trip.
#protection_poll_interval: 60.0

x_param_stall_pos_err_rad: 0.007
y_param_stall_pos_err_rad: 0.007
x_controller_cur_filter_param_en: 1
y_controller_cur_filter_param_en: 1

# --- 0x0C protection protocol notes (see docs/research-notes.md) ---
# read  = ADDR 0x0C 0x0B -> 8-byte block, all-zero = healthy;
# clear = ADDR 0x0C 0x05 (fire-and-forget: stock sends it blind, no device
#         ever answers - an unanswered 0x05 is NOT a dropped poll);
# stock timeout class 2000 ms, retries 4.
# Wire captures show stock arms stall-mode (func 0x11 DATA=1) on BOTH X and
# Y ~19 ms apart; if the Y driver really rejects 0x11 (as observed live),
# compare motor fw version via 0x0F before changing this config.

# --- stock V1.1.260206 softness/tuning (gentle homing) ---
x_protection_param_prt_track_max_err: 0.3
x_protection_param_prt_track_err_time: 0.1
y_protection_param_prt_track_max_err: 0.3
y_protection_param_prt_track_err_time: 0.1
x_controller_pos_loop_pid_param_kp: 300
x_controller_spd_loop_pid_param_kp: 0.028
x_controller_spd_loop_pid_param_ki: 6.0
x_controller_cur_loop_pid_param_kp: 2.5
x_controller_cur_loop_pid_param_ki: 200.0
x_controller_leso_param_b0k: 1.0
x_controller_leso_param_z3k: 0
x_controller_leso_param_wp: 4000
x_controller_leso_param_ws: 4000
x_controller_leso_param_wd: 400
y_controller_pos_loop_pid_param_kp: 300
y_controller_spd_loop_pid_param_kp: 0.028
y_controller_spd_loop_pid_param_ki: 6.0
y_controller_cur_loop_pid_param_kp: 2.5
y_controller_cur_loop_pid_param_ki: 200.0
y_controller_leso_param_b0k: 1.0
y_controller_leso_param_z3k: 0
y_controller_leso_param_wp: 4000
y_controller_leso_param_ws: 4000
y_controller_leso_param_wd: 400

# --- diagnostic knobs (uncomment only for a specific fault hunt) ---
# master protection switch (value_id 173, uint16). Default 1. Setting 0
# disables firmware-side protection trips entirely - false
# 'excessive position tracking error' idle-trip experiments ONLY:
#x_protection_param_protect_en: 1
#y_protection_param_protect_en: 1
# zazen idle-current reduction (ids 217-223). Defaults: en=1,
# trigger 1.0 s, gains 1.0/0.5. If false trips cluster ~1 s after the
# motors stop, try raising the trigger time or disabling zazen:
#x_zazen_param_zazen_trigger_time_s: 1.0
#y_zazen_param_zazen_trigger_time_s: 1.0
#x_zazen_param_zazen_en: 1
#y_zazen_param_zazen_en: 1
